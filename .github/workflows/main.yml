# Add secrets at https://github.com/Adarsh469/Deadline-Planner/settings/secrets/actions

# DOCKERHUB_USERNAME
# DOCKERHUB_PAT

name: Build and Push Docker Image

on:
  push:
    branches:
      - updated_branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blueknight2345:deadline-planner
          # tags: ${{ secrets.DOCKERHUB_USERNAME }}/deadline-planner:${{ github.sha }}