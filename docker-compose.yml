services:
  # ── MySQL Database ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: deadline_planner
      MYSQL_USER: deadline
      MYSQL_PASSWORD: deadline
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udeadline", "-pdeadline" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Next.js App ─────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: mysql://deadline:deadline@db:3306/deadline_planner
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    # Run Prisma migrations then start the app
    command: >
      sh -c "npx prisma db push --accept-data-loss && node server.js"

  # ── Cron Runner (replaces Vercel crons) ─────────────────────────
  cron:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    volumes:
      - ./cron/crontab:/etc/crontabs/app:ro
      - ./cron/entrypoint.sh:/entrypoint.sh:ro
    command: [ "sh", "-c", "apk add --no-cache curl && /entrypoint.sh" ]

volumes:
  mysqldata:
